name: Windows build
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build, check and package
        shell: pwsh
        run: ./scripts/build.ps1 -Portable
      - uses: actions/upload-artifact@v4
        with:
          name: Reticle-win-x64
          path: artifacts/Reticle-v0.1.0-win-x64.zip
          if-no-files-found: error
